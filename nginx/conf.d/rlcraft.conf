# =========================
# HTTP: ACME challenge + redirect
# =========================

server {
    listen 80;
    server_name rlcraft.johnmgrubbs.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =========================
# HTTPS site
# =========================

server {
    listen 443 ssl;
    http2 on;

    server_name rlcraft.johnmgrubbs.io;

    ssl_certificate /etc/letsencrypt/live/rlcraft.johnmgrubbs.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rlcraft.johnmgrubbs.io/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 200 "RLCraft Minecraft server\n";
        add_header Content-Type text/plain;
    }
}
